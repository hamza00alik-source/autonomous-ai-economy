name = "autonomous-ai-economy-private-worker"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "aae-private-ai-economy"
database_id = "25bdc73f-615b-4b71-a7cd-86ba5cd615f8"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "761904"
  [ratelimits.simple]
  limit = 10
  period = 60

[[durable_objects.bindings]]
name = "AGENT_KEY_VAULT"
class_name = "AgentKeyVault"

[[migrations]]
tag = "v1-agent-key-vault"
new_sqlite_classes = ["AgentKeyVault"]

[[services]]
binding = "EXECUTION_RUNTIME"
service = "aae-python-execution-runtime"

[[r2_buckets]]
binding = "EXECUTION_ARTIFACTS"
bucket_name = "aae-private-execution-artifacts"
