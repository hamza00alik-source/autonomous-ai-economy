name = "autonomous-ai-economy-private-worker"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "aae-private-ai-economy"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "761904"
  [ratelimits.simple]
  limit = 10
  period = 60
