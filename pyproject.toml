[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ai-economy"
version = "0.1.0"
description = "Zero-cost-first open economy foundation for human and AI participants"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
identity = ["cryptography>=42"]

[project.scripts]
economy = "economy.cli:main"
economy-supervisor = "economy.supervisor:main"
economy-product = "economy.product_bundle:main"
economy-game-assets = "economy.game_asset_pack:main"
economy-ai = "economy.ai_cli:main"\neconomy-gumroad-draft = "economy.gumroad_draft:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
