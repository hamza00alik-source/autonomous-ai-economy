name: SwarmMemo offline cited-fetch privacy reproduction

on:
  push:
    branches: [main]
    paths:
      - "scripts/swarmmemo-cite-query-repro-retry.trigger"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out AAE evidence harness
        uses: actions/checkout@v4

      - name: Fetch pinned SwarmMemo public source snapshot
        env:
          UPSTREAM_COMMIT: 454000fa75f06abc1af28d8ebea84214a41be120
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/Hugo0/swarmmemo.git /tmp/swarmmemo
          git -C /tmp/swarmmemo checkout --detach "$UPSTREAM_COMMIT"
          git -C /tmp/swarmmemo rev-parse HEAD
          printf 'Pinned source commit: %s\n' "$UPSTREAM_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Install upstream Go version
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: false

      - name: Add offline fetch URL parsing test
        run: |
          cat > /tmp/swarmmemo/internal/services/aae_fetch_query_repro_test.go <<'EOF'
          package services

          import "testing"

          func TestAAEBountyFetchURLQuerySurvivesParsing(t *testing.T) {
            raw := "https://example.test/private?token=AAE_TEST_QUERY_SECRET_DO_NOT_USE"
            parsed, err := parseFetchURL(raw)
            if err != nil {
              t.Fatalf("expected public HTTPS URL with query to be accepted: %v", err)
            }
            if got := parsed.String(); got != raw {
              t.Fatalf("expected parsed URL to preserve exact query, got %q", got)
            }
            t.Printf("REPRODUCED: fetch URL parser retains synthetic sensitive query value in URL: %s\n", parsed.RawQuery)
          }
          EOF

      - name: Run fetch URL parsing test against upstream
        working-directory: /tmp/swarmmemo
        run: go test ./internal/services -run '^TestAAEBountyFetchURLQuerySurvivesParsing$' -count=1 -v

      - name: Add offline cited-fetch history integration test
        run: |
          cat > /tmp/swarmmemo/internal/board/aae_cite_query_repro_test.go <<'EOF'
          package board

          import (
            "encoding/json"
            "fmt"
            "strings"
            "testing"
          )

          func TestAAEBountyCitedFetchTargetExposesQuerySecret(t *testing.T) {
            s := toolHistoryStore(t)
            key := keyFor(177)
            register(t, s, key)
            account := keyID(key)
            callID := fmt.Sprintf("%032x", 177)
            secret := "AAE_TEST_QUERY_SECRET_DO_NOT_USE"
            target := "https://example.test/private?token=" + secret
            body, err := json.Marshal(map[string]any{
              "url": target,
              "final_url": target,
              "status": 200,
              "raw_sha256": strings.Repeat("a", 64),
              "text_bytes": 42,
              "text": "synthetic page body",
            })
            if err != nil {
              t.Fatal(err)
            }
            seedHistoryCall(t, s, callID, account, "fetch", "page", string(body), testTime-100)
            run(t, s, signed(key, Command{
              Operation: "service.cite",
              Target: callID,
              Data: "{\\"schema\\":1,\\"public\\":true}",
              RequestID: randomID(),
            }))
            cited, ok, err := s.CitedCall(testContext, callID)
            if err != nil || !ok {
              t.Fatalf("cited call: ok=%v err=%v", ok, err)
            }
            public, err := json.Marshal(cited)
            if err != nil {
              t.Fatal(err)
            }
            if !strings.Contains(string(public), secret) {
              t.Fatalf("expected query disclosure reproduction, got %s", public)
            }
            fmt.Printf("REPRODUCED: cited fetch target exposed synthetic query token %q in public /api/calls/%s\n", secret, callID)
          }
          EOF

      - name: Run cited-fetch history integration test against upstream
        working-directory: /tmp/swarmmemo
        run: go test ./internal/board -run '^TestAAEBountyCitedFetchTargetExposesQuerySecret$' -count=1 -v

      - name: Record test boundary
        if: always()
        run: |
          {
            echo "Offline tests against pinned public source snapshot 454000fa75f06abc1af28d8ebea84214a41be120."
            echo "Only synthetic keys and synthetic token values were used in isolated test databases."
            echo "No network fetch, production mutation, or security probe was performed."
          } >> "$GITHUB_STEP_SUMMARY"
