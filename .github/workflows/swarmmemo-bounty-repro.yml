name: SwarmMemo offline bounty reproductions

on:
  push:
    branches: [main]
    paths:
      - "scripts/swarmmemo-bounty-repro.trigger"
      - "scripts/swarmmemo-cite-query-repro.trigger"
      - "scripts/swarmmemo-cite-query-repro-retry.trigger"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out AAE evidence harness
        uses: actions/checkout@v4

      - name: Fetch pinned SwarmMemo source
        env:
          UPSTREAM_COMMIT: 6382efc1d1eef87a7aa4bf3735d146b08b4c15fb
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/Hugo0/swarmmemo.git /tmp/swarmmemo
          git -C /tmp/swarmmemo checkout --detach "$UPSTREAM_COMMIT"
          printf 'UPSTREAM_COMMIT=%s\n' "$UPSTREAM_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          git -C /tmp/swarmmemo rev-parse HEAD

      - name: Install upstream Go version
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: false

      - name: Add offline duplicate-reply integration reproduction
        run: |
          cat > /tmp/swarmmemo/internal/board/aae_bounty_repro_test.go <<'EOF'
          package board

          import (
            "errors"
            "fmt"
            "strings"
            "testing"
            "time"
          )

          func TestAAEBountyMeaningfulHTTPStatusFalsePositive(t *testing.T) {
            s := openTest(t, Config{})
            base := time.Unix(testTime, 0)
            s.now = func() time.Time { return base }
            asker, worker := keyFor(141), keyFor(142)
            parent := postAs(t, s, asker, Command{Room: "bounties", Text: "Offline regression task", RequestID: "aae-task"})
            common := strings.Repeat("The same public endpoint was requested with the same method and path. The response was parsed and the result was recorded. ", 3)
            firstText := common + "Observed HTTP status: 404."
            secondText := common + "Observed HTTP status: 500."
            if len([]rune(firstText)) < ReplyRepeatMaskMinRunes || len([]rune(secondText)) < ReplyRepeatMaskMinRunes {
              t.Fatal("messages must both activate long-reply masking")
            }
            postAs(t, s, worker, Command{Room: "bounties", ReplyTo: parent, Text: firstText, RequestID: "aae-first-result"})
            s.now = func() time.Time { return base.Add(time.Minute) }
            _, err := s.Execute(testContext, signed(worker, Command{
              Operation: "post", Room: "bounties", ReplyTo: parent, Text: secondText,
              RequestID: "aae-second-result", Timestamp: s.now().Unix(),
            }), "test-origin")
            var boardErr *Error
            if !errors.As(err, &boardErr) || boardErr.Code != "duplicate_reply" || boardErr.Status != 409 {
              t.Fatalf("expected 409 duplicate_reply for distinct HTTP statuses, got %v", err)
            }
            fmt.Printf("REPRODUCED duplicate_reply: distinct HTTP 404 and 500 reports, same parent/account, 60 seconds apart\\n")
          }
          EOF

      - name: Run duplicate-reply reproduction against upstream package
        working-directory: /tmp/swarmmemo
        run: go test ./internal/board -run '^TestAAEBountyMeaningfulHTTPStatusFalsePositive$' -count=1 -v

      - name: Add offline cited-fetch query disclosure reproduction
        run: |
          cat > /tmp/swarmmemo/internal/board/aae_cite_query_repro_test.go <<'EOF'
          package board

          import (
            "encoding/json"
            "fmt"
            "strings"
            "testing"
          )

          func TestAAEBountyCitedFetchTargetExposesQuerySecret(t *testing.T) {
            s := toolHistoryStore(t)
            key := keyFor(177)
            register(t, s, key)
            account := keyID(key)
            callID := fmt.Sprintf("%032x", 177)
            secret := "AAE_TEST_QUERY_SECRET_DO_NOT_USE"
            target := "https://example.test/private?token=" + secret
            body, err := json.Marshal(map[string]any{
              "url": target,
              "final_url": target,
              "status": 200,
              "raw_sha256": strings.Repeat("a", 64),
              "text_bytes": 42,
              "text": "synthetic page body",
            })
            if err != nil {
              t.Fatal(err)
            }
            seedHistoryCall(t, s, callID, account, "fetch", "page", string(body), testTime-100)
            run(t, s, signed(key, Command{
              Operation: "service.cite",
              Target: callID,
              Data: "{\\"schema\\":1,\\"public\\":true}",
              RequestID: randomID(),
            }))
            cited, ok, err := s.CitedCall(testContext, callID)
            if err != nil || !ok {
              t.Fatalf("cited call: ok=%v err=%v", ok, err)
            }
            public, err := json.Marshal(cited)
            if err != nil {
              t.Fatal(err)
            }
            if !strings.Contains(string(public), secret) {
              t.Fatalf("expected query disclosure reproduction, got %s", public)
            }
            fmt.Printf("REPRODUCED cited-fetch query disclosure: synthetic token %q appears in public /api/calls/%s\\n", secret, callID)
          }
          EOF

      - name: Run cited-fetch query disclosure reproduction against upstream package
        working-directory: /tmp/swarmmemo
        run: go test ./internal/board -run '^TestAAEBountyCitedFetchTargetExposesQuerySecret$' -count=1 -v

      - name: Record offline test boundary
        if: always()
        run: |
          {
            echo "Tests ran against pinned public source in an isolated local test database."
            echo "Synthetic keys and a synthetic token only; no live fetch, production mutation, or security probe."
            echo "Reproductions are evidence, not accepted bounty claims."
          } >> "$GITHUB_STEP_SUMMARY"
