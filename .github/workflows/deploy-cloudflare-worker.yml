name: Deploy private Cloudflare AI worker

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-private-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit whose full Tests workflow passed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund
      - name: Test private Cloudflare worker logic
        run: node --test cloudflare/worker/test/*.test.js
      - name: Validate deployment secrets and D1 ID
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          AAE_QUEUE_TOKEN: ${{ secrets.AAE_QUEUE_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_D1_DATABASE_ID AAE_QUEUE_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required configuration: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "${#AAE_QUEUE_TOKEN}" -lt 32 ]; then
            echo "::error::AAE_QUEUE_TOKEN must be at least 32 characters"
            exit 1
          fi
          # This private-runtime deployment must never enable customer checkout.
          if ! echo "$CLOUDFLARE_D1_DATABASE_ID" | grep -Eq "^[0-9a-fA-F-]{36}$"; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID is malformed"
            exit 1
          fi
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$CLOUDFLARE_D1_DATABASE_ID/" wrangler.toml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build protected product download asset
        run: |
          set -euo pipefail
          python -m pip install -e .
          mkdir -p cloudflare/worker/public/downloads
          economy-game-assets build --output cloudflare/worker/public/downloads/moba-objective-props.zip
      - name: Apply D1 migrations
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply aae-private-ai-economy --remote
      - name: Set private queue secret
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AAE_QUEUE_TOKEN: ${{ secrets.AAE_QUEUE_TOKEN }}
        run: printf '%s' "$AAE_QUEUE_TOKEN" | npx wrangler secret put AAE_QUEUE_TOKEN
      - name: Force public commerce gates off
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf 'false' | npx wrangler secret put AAE_CRYPTO_ENABLEMENT_APPROVED
          printf 'false' | npx wrangler secret put AAE_PUBLIC_CHECKOUT_ENABLED
      - name: Deploy worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
