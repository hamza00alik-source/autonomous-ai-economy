name: Deploy private Cloudflare AI worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-private-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
      NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
      AAE_CRYPTO_ENABLEMENT_APPROVED: ${{ vars.AAE_CRYPTO_ENABLEMENT_APPROVED }}
      AAE_PUBLIC_CHECKOUT_ENABLED: ${{ vars.AAE_PUBLIC_CHECKOUT_ENABLED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deployment secrets and D1 ID
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          AAE_QUEUE_TOKEN: ${{ secrets.AAE_QUEUE_TOKEN }}
          NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
          NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
          AAE_CRYPTO_ENABLEMENT_APPROVED: ${{ vars.AAE_CRYPTO_ENABLEMENT_APPROVED }}
          AAE_PUBLIC_CHECKOUT_ENABLED: ${{ vars.AAE_PUBLIC_CHECKOUT_ENABLED }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$AAE_QUEUE_TOKEN"
          if [ -n "$NOWPAYMENTS_API_KEY" ] || [ -n "$NOWPAYMENTS_IPN_SECRET" ]; then
            test -n "$NOWPAYMENTS_API_KEY"
            test -n "$NOWPAYMENTS_IPN_SECRET"
            test "$AAE_CRYPTO_ENABLEMENT_APPROVED" = "true"
          fi
          if [ "$AAE_PUBLIC_CHECKOUT_ENABLED" = "true" ]; then
            test "$AAE_CRYPTO_ENABLEMENT_APPROVED" = "true"
            test -n "$NOWPAYMENTS_API_KEY"
            test -n "$NOWPAYMENTS_IPN_SECRET"
          fi
          echo "$CLOUDFLARE_D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$CLOUDFLARE_D1_DATABASE_ID/" wrangler.toml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build protected product download asset
        run: |
          set -euo pipefail
          python -m pip install -e .
          mkdir -p cloudflare/worker/public/downloads
          economy-game-assets build --output cloudflare/worker/public/downloads/moba-objective-props.zip
      - name: Install Wrangler
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund
      - name: Apply D1 migrations
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply aae-private-ai-economy --remote
      - name: Set private queue secret
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AAE_QUEUE_TOKEN: ${{ secrets.AAE_QUEUE_TOKEN }}
        run: printf '%s' "$AAE_QUEUE_TOKEN" | npx wrangler secret put AAE_QUEUE_TOKEN
      - name: Set optional NOWPayments API key
        if: ${{ env.NOWPAYMENTS_API_KEY != '' }}
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
        run: printf '%s' "$NOWPAYMENTS_API_KEY" | npx wrangler secret put NOWPAYMENTS_API_KEY
      - name: Set optional NOWPayments IPN secret
        if: ${{ env.NOWPAYMENTS_IPN_SECRET != '' }}
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
        run: printf '%s' "$NOWPAYMENTS_IPN_SECRET" | npx wrangler secret put NOWPAYMENTS_IPN_SECRET
      - name: Set crypto enablement approval gate
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AAE_CRYPTO_ENABLEMENT_APPROVED: ${{ vars.AAE_CRYPTO_ENABLEMENT_APPROVED }}
        run: printf '%s' "${AAE_CRYPTO_ENABLEMENT_APPROVED:-false}" | npx wrangler secret put AAE_CRYPTO_ENABLEMENT_APPROVED
      - name: Set public checkout feature flag
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AAE_PUBLIC_CHECKOUT_ENABLED: ${{ vars.AAE_PUBLIC_CHECKOUT_ENABLED }}
        run: printf '%s' "${AAE_PUBLIC_CHECKOUT_ENABLED:-false}" | npx wrangler secret put AAE_PUBLIC_CHECKOUT_ENABLED
      - name: Deploy worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
