name: Deploy private Cloudflare AI worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-private-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deployment secrets and D1 ID
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          AAE_QUEUE_TOKEN: ${{ secrets.AAE_QUEUE_TOKEN }}
          AAE_EXECUTION_BRIDGE_SECRET: ${{ secrets.AAE_EXECUTION_BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$AAE_QUEUE_TOKEN"
          test "${#AAE_EXECUTION_BRIDGE_SECRET}" -ge 32
          # This private-runtime deployment must never enable customer checkout.
          echo "$CLOUDFLARE_D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$CLOUDFLARE_D1_DATABASE_ID/" wrangler.toml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build protected product download asset
        run: |
          set -euo pipefail
          python -m pip install -e .
          mkdir -p cloudflare/worker/public/downloads
          economy-game-assets build --output cloudflare/worker/public/downloads/moba-objective-props.zip
      - name: Install Wrangler
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund
      - name: Apply D1 migrations
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply aae-private-ai-economy --remote
      - name: Prepare isolated Python runtime package
        run: python tools/prepare_cloudflare_python_runtime.py
      - name: Deploy private Python execution runtime
        working-directory: cloudflare/python-runtime
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AAE_EXECUTION_BRIDGE_SECRET: ${{ secrets.AAE_EXECUTION_BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          uv sync --group dev
          printf '%s' "$AAE_EXECUTION_BRIDGE_SECRET" | uv run pywrangler secret put AAE_EXECUTION_BRIDGE_SECRET
          uv run pywrangler deploy
      - name: Set private queue secret
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AAE_QUEUE_TOKEN: ${{ secrets.AAE_QUEUE_TOKEN }}
          AAE_EXECUTION_BRIDGE_SECRET: ${{ secrets.AAE_EXECUTION_BRIDGE_SECRET }}
        run: |
          printf '%s' "$AAE_QUEUE_TOKEN" | npx wrangler secret put AAE_QUEUE_TOKEN
          printf '%s' "$AAE_EXECUTION_BRIDGE_SECRET" | npx wrangler secret put AAE_EXECUTION_BRIDGE_SECRET
      - name: Force public commerce gates off
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf 'false' | npx wrangler secret put AAE_CRYPTO_ENABLEMENT_APPROVED
          printf 'false' | npx wrangler secret put AAE_PUBLIC_CHECKOUT_ENABLED
      - name: Deploy worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
