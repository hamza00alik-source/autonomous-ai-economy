name: Base USDC contract tests

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/base-usdc-contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/base-usdc-contract-tests.yml"

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Foundry standard test helpers
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-commit
      - name: Run contract tests
        working-directory: contracts
        run: forge test -vvv
