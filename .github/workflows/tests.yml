name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Bubblewrap for sandbox integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Report delegated cgroup v2 availability
        run: |
          echo "Process cgroup:"
          cat /proc/self/cgroup
          echo "cgroup2 mounts:"
          findmnt -t cgroup2 -o TARGET,OPTIONS || true
          if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
            echo "Available controllers:"
            cat /sys/fs/cgroup/cgroup.controllers
            echo "Enabled child controllers:"
            cat /sys/fs/cgroup/cgroup.subtree_control
            echo "Root writable: $(test -w /sys/fs/cgroup && echo yes || echo no)"
          else
            echo "No visible cgroup v2 controller root"
          fi
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,identity]"
      - name: Run Python test suite
        run: python -m pytest -q
      - name: Verify Gumroad draft CLI is registered
        run: economy-gumroad-draft --help
      - name: Verify private worker client CLI is registered
        run: economy-cloudflare-copy --help
      - name: Verify AI runtime status is offline and secret-safe
        run: economy-ai --data-dir /tmp/aae-ai-runtime-ci status
      - name: Verify AI product-copy task can be queued without credentials
        run: economy-ai --data-dir /tmp/aae-ai-queue-ci queue-copy --facts-file products/moba-objective-props/product-facts.json
      - name: Check standalone product JavaScript
        run: python tools/check_product_js.py
      - name: Test private Cloudflare worker logic
        run: node --test cloudflare/worker/test/*.test.js
      - name: Test Durable Object CryptoKey persistence in workerd
        run: |
          npm --prefix cloudflare/worker install --no-audit --no-fund
          npm --prefix cloudflare/worker run test:workers
      - name: Build first digital product bundle
        run: economy-product build --output dist/store-catalog-cleaner.zip
      - name: Build original MOBA game asset pack
        run: economy-game-assets build --output dist/moba-objective-props.zip
      - name: Install verified Godot 4.7.2 headless
        env:
          GODOT_RELEASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-install
          cd /tmp/godot-install
          curl -fsSLO "$GODOT_RELEASE/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSLO "$GODOT_RELEASE/SHA512-SUMS.txt"
          sha512sum --ignore-missing -c SHA512-SUMS.txt
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import and run the delivered Godot project headlessly
        run: |
          set -euo pipefail
          mkdir -p dist/godot-project
          unzip -q dist/moba-objective-props.zip -d dist/godot-project
          test -s dist/godot-project/project.godot
          godot --headless --path dist/godot-project --import --log-file /tmp/aae-godot-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:' /tmp/aae-godot-import.log; then
            cat /tmp/aae-godot-import.log
            exit 1
          fi
          godot --headless --path dist/godot-project --quit-after 3 --log-file /tmp/aae-godot-smoke.log
          if grep -E 'ERROR:|SCRIPT ERROR:' /tmp/aae-godot-smoke.log; then
            cat /tmp/aae-godot-smoke.log
            exit 1
          fi
          test -d dist/godot-project/.godot/imported
      - name: Validate Cloudflare Worker and protected static assets (dry run)
        run: |
          set -euo pipefail
          npm --prefix cloudflare/worker install --no-audit --no-fund
          mkdir -p cloudflare/worker/public/downloads
          cp dist/moba-objective-props.zip cloudflare/worker/public/downloads/moba-objective-props.zip
          sed -i 's/REPLACE_WITH_D1_DATABASE_ID/00000000-0000-0000-0000-000000000000/' cloudflare/worker/wrangler.toml
          (cd cloudflare/worker && npx wrangler deploy --dry-run --outdir /tmp/aae-worker-dry-run)
          test -s /tmp/aae-worker-dry-run/index.js
          (cd cloudflare/worker && npx wrangler d1 migrations apply aae-private-ai-economy --local --persist-to /tmp/aae-d1-migration-test)
      - name: Verify official Gumroad CLI draft and upload dry-run
        run: |
          set -euo pipefail
          version="v0.20261106.1"
          base="https://github.com/antiwork/gumroad-cli/releases/download/$version"
          curl -fsSL "$base/checksums.txt" -o checksums.txt
          curl -fsSL "$base/gumroad-cli_linux_amd64.tar.gz" -o gumroad-cli_linux_amd64.tar.gz
          grep 'gumroad-cli_linux_amd64.tar.gz$' checksums.txt | sha256sum --check -
          mkdir -p gumroad-cli-extracted
          tar -xzf gumroad-cli_linux_amd64.tar.gz -C gumroad-cli-extracted
          binary="$(find gumroad-cli-extracted -type f -name gumroad -perm -u+x -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" products create --name "MOBA Objective Props CI Draft Check" --price 5.00 --currency usd --description "<p>CI dry-run only.</p>" --custom-summary "Five low-poly GLB props for Godot 4." --category 3d --draft --file dist/moba-objective-props.zip --file-name "moba-objective-props.zip" --file-description "3D asset pack" --tag low-poly --tag "GLB models" --dry-run --json --no-input --quiet > gumroad-dry-run.json
          python -c 'import json; d=json.load(open("gumroad-dry-run.json")); assert d.get("dry_run") is True; assert d.get("uploads"), d'
      - name: Upload MOBA game asset pack for review
        uses: actions/upload-artifact@v4
        with:
          name: moba-objective-props
          path: dist/moba-objective-props.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload product bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: store-catalog-cleaner
          path: dist/store-catalog-cleaner.zip
          if-no-files-found: error
          retention-days: 14
